; Shared across all hardware envs below; each [env:xxx] adds only its own
; board/platform settings and appends its own extra build_flags / lib_deps.
[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 1500000
build_unflags =
	-std=gnu++11
build_flags =
	-Wl,-zmuldefs
	-std=gnu++17
	-finput-charset=UTF-8
	-fexec-charset=UTF-8
	-mtext-section-literals
	-Os
lib_deps =
	m5stack/M5Unified@0.2.19
	m5stack/M5GFX@0.2.33
	adafruit/Adafruit PN532@^1.1.0
	https://github.com/blackketter/ESP32-BLE-Combo.git
	dfrobot/DFRobot_GP8XXX @ 1.0.1
	olikraus/U8g2@^2.35.30
	arduino-libraries/NTPClient@^3.2.1
	z3t0/IRremote@^4.4.1
	bitbank2/AnimatedGIF
	https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#v3.0.2


[env:m5stick-c-plus2]
platform = platformio/espressif32@7.0.1
board = m5stickc_plus2
build_flags =
	${env.build_flags}
	-DRAW_BUFFER_LENGTH=750
upload_port = COM3


[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
	${env.build_flags}
	-DESP32S3
	-DSTICKS3
	-DIR_USE_RMT
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
upload_port = COM6


[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DESP32S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DSTICKS3
	-DCARDPUTER
lib_deps =
	${env.lib_deps}
	M5Cardputer=https://github.com/m5stack/M5Cardputer
upload_port = COM4


; The project needs to be adapted for emulation
[env:native]
platform = native
build_type = debug
build_flags = 
	-O0 -std=c++14
	-I/ucrt64/include/SDL2
	-L/ucrt64/lib
	-lmingw32 -lSDL2main -lSDL2
	-mwindows
	-DM5GFX_SHOW_FRAME
	-DM5GFX_BOARD=board_M5StickCPlus
	-DM5GFX_SCALE=2
	-DEMULATION=1
lib_deps = 
	m5stack/M5Unified
	m5stack/M5GFX
lib_ignore = 
	WiFi